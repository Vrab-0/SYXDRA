<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>SYXDRA · Accesorios que definen tu esencia</title>
<meta name="theme-color" content="#060309">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">

<style>
/* ============================================================
   SYXDRA · ESTILOS (tema oscuro + morado, mobile-first)
   ============================================================ */
:root {
  --bg: #060309;
  --bg-elevated: #0e0916;
  --bg-card: #120b1c;
  --purple-deep: #3b0f6b;
  --purple: #8b3ff2;
  --purple-bright: #b478ff;
  --text: #f3f0f7;
  --text-muted: #a89cba;
  --text-dim: #6f6480;
  --border: rgba(180, 120, 255, 0.18);
  --border-strong: rgba(180, 120, 255, 0.4);
  --danger: #ef4444;
  --success: #22c55e;
  --font-display: 'Cinzel', serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --radius: 14px;
  --radius-sm: 8px;
  --max-width: 520px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }
input { font-family: inherit; }

.announce {
    width: 100%;
    height: auto;
    background: #000;
    padding: 0;
    margin: 0;
    overflow: hidden;
    line-height: 0;
}

.announce img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
}

.brand-story-image {
    width: 100%;
    margin: 0;
    padding: 0;
    line-height: 0;
    overflow: hidden;
}

.brand-story-image img {
    display: block;
    width: 100%;
    height: auto;
    max-width: none;
    margin: 0;
    border-radius: 0;
}

.bg-image {
    position: fixed;
    top: 18px;
    left: 50%;
    width: 100%;
    height: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    transform: translateX(-50%);
    object-fit: cover;
    object-position: center;
    z-index: -2;
    pointer-events: none;
}


.app {
    min-height: 100vh;
}




body {
  background: #000;
}

.bg-overlay {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(ellipse 700px 500px at 50% -10%, rgba(6,3,9,0.05), rgba(6,3,9,0.3) 65%),
    linear-gradient(180deg, rgba(6,3,9,0.05) 0%, rgba(6,3,9,0.25) 55%, rgba(6,3,9,0.45) 100%);
}
@media (prefers-reduced-motion: reduce) {
  .bg-video { display: none; }
}

.app { max-width: var(--max-width); margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 40px; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--purple-deep); border-radius: 10px; }

.divider-spark { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--purple-bright); font-size: 10px; }
.divider-spark::before, .divider-spark::after { content: ""; height: 1px; width: 32px; background: linear-gradient(90deg, transparent, var(--border-strong)); }
.divider-spark::after { background: linear-gradient(90deg, var(--border-strong), transparent); }

.navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 6px 18px;

    position: relative;
    z-index: 40;

    background: rgba(6, 3, 9, 0.95);
    backdrop-filter: blur(10px);

    border-bottom: 1px solid var(--border);

    transition: none;
}

.navbar.navbar-fixed {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);

    width: 100%;
    max-width: 520px;

    z-index: 100;

    background: rgba(6, 3, 9, 0.95);
    backdrop-filter: blur(10px);
}

.navbar .brand { display: flex; align-items: center; }
.navbar .brand .brand-logo { height: 34px; width: auto; filter: drop-shadow(0 0 6px rgba(168,85,247,0.35)); }
.navbar .icon-btn { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: transparent; border: 1px solid transparent; color: var(--text); transition: background .15s ease, border-color .15s ease, transform .1s ease; }
.navbar .icon-btn:active { transform: scale(0.92); background: var(--purple-deep); border-color: var(--border-strong); }

.hero { padding: 46px 20px 30px; text-align: center; position: relative; overflow: hidden; }
.hero .glow { position: absolute; top: -80px; left: 50%; transform: translateX(-50%); width: 340px; height: 340px; background: radial-gradient(circle, rgba(139,63,242,0.35), transparent 70%); filter: blur(10px); pointer-events: none; }
.hero > img {
    width: 100%;
    max-width: 350px;
    height: auto;
    margin: 0 auto;
    display: block;
    position: relative;
    z-index: 1;
}
.hero .tagline { margin-top: 14px; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); position: relative; z-index: 1; }
.hero .cta { margin-top: 24px; display: inline-flex; align-items: center; gap: 8px; padding: 14px 30px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); font-family: var(--font-display); font-size: 12px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text); background: linear-gradient(180deg, rgba(139,63,242,0.15), transparent); transition: transform .12s ease, box-shadow .2s ease; position: relative; z-index: 1; }
.hero .cta:active { transform: scale(0.97); box-shadow: 0 0 24px rgba(168,85,247,0.35); }
@keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.brand-story { display: flex; align-items: center; gap: 24px; padding: 40px 20px; margin: 10px 16px 30px; border: 1px solid var(--border); border-radius: var(--radius-md); background: linear-gradient(180deg, rgba(139,63,242,0.06), transparent); }
.brand-story .text { flex: 1 1 55%; min-width: 0; }
.brand-story h3 { font-family: var(--font-display); font-size: 20px; letter-spacing: 4px; color: var(--purple-bright); margin: 0 0 14px; }
.brand-story p { font-size: 13px; line-height: 1.7; color: var(--text-muted); margin: 0 0 4px; }
.brand-story .cta-outline { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; padding: 12px 22px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); font-family: var(--font-display); font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text); transition: transform .12s ease, box-shadow .2s ease; }
.brand-story .cta-outline:active { transform: scale(0.97); box-shadow: 0 0 20px rgba(168,85,247,0.3); }
.brand-story .art { flex: 1 1 40%; display: flex; justify-content: center; }
.brand-story .art img { width: 100%; max-width: 220px; height: auto; filter: drop-shadow(0 0 22px rgba(168,85,247,0.4)); }
@media (max-width: 520px) {
  .brand-story { flex-direction: column; text-align: center; padding: 30px 18px; }
  .brand-story .art img { max-width: 160px; }
}

.search-wrap { padding: 0 18px; max-height: 0; overflow: hidden; transition: max-height .25s ease, padding .25s ease; }
.search-wrap.open { max-height: 70px; padding: 0 18px 14px; }
.search-input { width: 100%; padding: 13px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text); font-size: 14px; outline: none; transition: border-color .15s ease; }
.search-input::placeholder { color: var(--text-dim); }
.search-input:focus { border-color: var(--border-strong); }

.categories { display: flex; gap: 10px; padding: 4px 18px 20px; overflow-x: auto; scrollbar-width: none; }
.categories::-webkit-scrollbar { display: none; }
.chip { flex-shrink: 0; padding: 9px 18px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text-muted); font-size: 12.5px; font-weight: 600; letter-spacing: 0.5px; transition: all .15s ease; }
.chip.active { color: #fff; border-color: var(--border-strong); background: linear-gradient(135deg, var(--purple-deep), var(--purple)); box-shadow: 0 0 16px rgba(139,63,242,0.4); }
.chip:active { transform: scale(0.95); }

.section-title { padding: 6px 18px 14px; text-align: center; }
.section-title .divider-spark { margin-top: 6px; font-family: var(--font-display); letter-spacing: 3px; }

.product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 18px 10px; }
.product-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: transform .15s ease, border-color .15s ease; position: relative; }
.product-card:active { transform: scale(0.98); }
.product-card .img-wrap { aspect-ratio: 1 / 1; background: linear-gradient(160deg, var(--bg-elevated), #1a1024); position: relative; overflow: hidden; }
.product-card .img-wrap img { width: 100%; height: 100%; object-fit: cover; }
.product-card .img-wrap .placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--text-dim); }

.badge { position: absolute; top: 8px; left: 8px; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; padding: 4px 8px; border-radius: 5px; text-transform: uppercase; z-index: 2; }
.badge.nuevo { background: var(--purple); color: #fff; }
.badge.sin-stock { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.4); top: auto; bottom: 8px; left: 8px; }

.product-card .info { padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.product-card .name { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
.product-card .cat { font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
.product-card .row-bottom { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 6px; }
.product-card .price { font-family: var(--font-display); font-size: 16px; font-weight: 600; color: var(--purple-bright); }

.buy-btn { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--purple); color: #fff; transition: transform .12s ease, box-shadow .15s ease; flex-shrink: 0; }
.buy-btn:active { transform: scale(0.9); }
.buy-btn[disabled] { background: transparent; border-color: var(--border); color: var(--text-dim); cursor: not-allowed; }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
.empty-state svg { margin: 0 auto 14px; color: var(--purple-deep); }

.footer { margin-top: 30px; padding: 26px 18px 20px; text-align: center; border-top: 1px solid var(--border); }
.footer .brand-mini { font-family: var(--font-display); letter-spacing: 3px; font-size: 13px; color: var(--purple-bright); margin-bottom: 6px; }
.footer p { font-size: 10.5px; color: var(--text-dim); letter-spacing: 0.5px; }
.footer .admin-link { display: inline-block; margin-top: 14px; font-size: 10.5px; color: var(--text-dim); border-bottom: 1px dotted var(--text-dim); }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--bg-elevated); border: 1px solid var(--border-strong); color: var(--text); padding: 12px 20px; border-radius: 999px; font-size: 13px; font-weight: 500; box-shadow: 0 8px 30px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 100; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.skel { background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-elevated) 50%, var(--bg-card) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   SYXDRA · CONFIGURACIÓN
   👇 EDITÁ SOLO ESTAS 4 LÍNEAS con tus datos reales de Supabase
   ============================================================ */
const SUPABASE_URL = "https://helpxltbpmuwubhxwtanm.supabase.co";
const SUPABASE_ANON_KEY = "Tsb_publishable_RJDxbwGhRQeR6l_QMFSdIQ_5oq9m9Ri";
const WHATSAPP_NUMBER = "5493644000000";
const STORAGE_BUCKET = "productos-imagenes";
const TABLE_NAME = "productos";
/* ============================================================ */

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let TODOS_LOS_PRODUCTOS = [];
let categoriaActiva = "todos";
let textoBusqueda = "";

const grid = document.getElementById("productGrid");
const toastEl = document.getElementById("toast");

async function cargarProductos() {
  const { data, error } = await sb.from(TABLE_NAME).select("*").order("creado_en", { ascending: false });

  if (error) {
    console.error("Error al cargar productos:", error);
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">No se pudieron cargar los productos.<br>Revisá tu conexión con Supabase en la parte de arriba del código.</div>`;
    return;
  }

  TODOS_LOS_PRODUCTOS = data || [];
  renderizarProductos();
}

function obtenerProductosFiltrados() {
  return TODOS_LOS_PRODUCTOS.filter((p) => {
    const coincideCategoria = categoriaActiva === "todos" || p.categoria === categoriaActiva;
    const coincideBusqueda = p.nombre.toLowerCase().includes(textoBusqueda.toLowerCase());
    return coincideCategoria && coincideBusqueda;
  });
}

function renderizarProductos() {
  const productos = obtenerProductosFiltrados();

  if (productos.length === 0) {
    grid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M3 3L21 21M21 3L3 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        No encontramos productos con esos filtros.
      </div>`;
    return;
  }

  grid.innerHTML = productos.map((p) => tarjetaProducto(p)).join("");

  grid.querySelectorAll("[data-buy]").forEach((btn) => {
    btn.addEventListener("click", () => comprarPorWhatsapp(btn.dataset.buy));
  });
}

function tarjetaProducto(p) {
  const enStock = p.stock > 0;
  const precioFormateado = Number(p.precio).toLocaleString("es-AR");
  const esNuevo = esProductoReciente(p.creado_en);

  return `
    <div class="product-card">
      <div class="img-wrap">
        ${esNuevo ? '<span class="badge nuevo">Nuevo</span>' : ""}
        ${!enStock ? '<span class="badge sin-stock">Sin stock</span>' : ""}
        ${
          p.imagen_url
            ? `<img src="${p.imagen_url}" alt="${escaparHtml(p.nombre)}" loading="lazy">`
            : `<div class="placeholder"><svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M3 3L21 21M21 3L3 21" stroke="currentColor" stroke-width="1.2"/></svg></div>`
        }
      </div>
      <div class="info">
        <span class="cat">${p.categoria}</span>
        <span class="name">${escaparHtml(p.nombre)}</span>
        <div class="row-bottom">
          <span class="price">$${precioFormateado}</span>
          <button class="buy-btn" data-buy="${p.id}" ${enStock ? "" : "disabled"} aria-label="Comprar ${escaparHtml(p.nombre)}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.38 5.07L2 22l5.07-1.35C8.53 21.5 10.22 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm5.2 14.2c-.22.62-1.28 1.2-1.76 1.24-.45.05-.9.24-3.03-.63-2.56-1.05-4.2-3.6-4.33-3.77-.13-.17-1.03-1.37-1.03-2.6 0-1.24.65-1.85.88-2.1.23-.25.5-.31.67-.31.17 0 .34 0 .48.01.16.01.36-.06.56.43.22.53.74 1.83.8 1.96.06.13.1.28.02.45-.08.17-.13.28-.25.43-.13.15-.27.34-.38.46-.13.13-.26.28-.11.55.15.27.68 1.13 1.47 1.83 1.01.9 1.86 1.19 2.13 1.32.27.13.43.11.6-.07.16-.18.68-.79.87-1.06.18-.27.36-.22.6-.13.25.09 1.58.75 1.85.88.27.13.45.2.51.31.07.11.07.63-.15 1.25z"/></svg>
          </button>
        </div>
      </div>
    </div>`;
}

function esProductoReciente(fecha) {
  if (!fecha) return false;
  const dias = (Date.now() - new Date(fecha).getTime()) / (1000 * 60 * 60 * 24);
  return dias <= 14;
}

function escaparHtml(texto) {
  const div = document.createElement("div");
  div.textContent = texto;
  return div.innerHTML;
}

function comprarPorWhatsapp(idProducto) {
  const producto = TODOS_LOS_PRODUCTOS.find((p) => p.id === idProducto);
  if (!producto || producto.stock <= 0) return;

  const precioFormateado = Number(producto.precio).toLocaleString("es-AR");
  const mensaje = `¡Hola SYXDRA! 👋 Quiero comprar:\n\n*${producto.nombre}*\nCategoría: ${producto.categoria}\nPrecio: $${precioFormateado}\n\n¿Está disponible?`;
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(mensaje)}`;
  window.open(url, "_blank");
}

document.getElementById("categoryChips").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  document.querySelectorAll(".chip").forEach((c) => c.classList.remove("active"));
  chip.classList.add("active");
  categoriaActiva = chip.dataset.cat;
  renderizarProductos();
});

const searchToggle = document.getElementById("searchToggle");
const searchWrap = document.getElementById("searchWrap");
const searchInput = document.getElementById("searchInput");

searchToggle.addEventListener("click", () => {
  searchWrap.classList.toggle("open");
  if (searchWrap.classList.contains("open")) searchInput.focus();
});

let debounceTimer;
searchInput.addEventListener("input", (e) => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    textoBusqueda = e.target.value.trim();
    renderizarProductos();
  }, 200);
});

function mostrarToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 2200);
}

cargarProductos();

function ajustarAlturaHeader() {
  const announce = document.querySelector('.announce');
  const navbar = document.querySelector('.navbar');
  const alto = (announce ? announce.offsetHeight : 0) + (navbar ? navbar.offsetHeight : 0) + 55;
  document.documentElement.style.setProperty('--header-h', alto + 'px');
}

window.addEventListener('load', ajustarAlturaHeader);
window.addEventListener('resize', ajustarAlturaHeader);
document.querySelector('.announce img')?.addEventListener('load', ajustarAlturaHeader);   
   
</script>
