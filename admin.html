<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>SYXDRA · Panel Admin</title>
<meta name="theme-color" content="#060309">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">

<style>
:root {
  --bg: #060309;
  --bg-elevated: #0e0916;
  --bg-card: #120b1c;
  --purple-deep: #3b0f6b;
  --purple: #8b3ff2;
  --purple-bright: #b478ff;
  --text: #f3f0f7;
  --text-muted: #a89cba;
  --text-dim: #6f6480;
  --border: rgba(180, 120, 255, 0.18);
  --border-strong: rgba(180, 120, 255, 0.4);
  --danger: #ef4444;
  --success: #22c55e;
  --font-display: 'Cinzel', serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --radius: 14px;
  --radius-sm: 8px;
  --max-width: 520px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(ellipse 600px 400px at 50% -10%, rgba(139, 63, 242, 0.16), transparent),
    radial-gradient(ellipse 500px 300px at 90% 30%, rgba(139, 63, 242, 0.08), transparent);
  background-attachment: fixed;
}
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }
input, select { font-family: inherit; }
.app { max-width: var(--max-width); margin: 0 auto; min-height: 100vh; position: relative; padding-bottom: 40px; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--purple-deep); border-radius: 10px; }

.admin-shell { min-height: 100vh; display: flex; flex-direction: column; }

.login-view { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 30px 24px; gap: 26px; }
.login-view .login-logo { width: 100%; max-width: 300px; height: auto; margin: 0 auto; display: block; filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.4)); }
.login-view .sub { text-align: center; font-size: 12px; letter-spacing: 1.5px; color: var(--text-dim); text-transform: uppercase; margin-top: 4px; }

.field { display: flex; flex-direction: column; gap: 7px; }
.field label { font-size: 11.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); }
.field input, .field select { padding: 14px 15px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text); font-size: 14.5px; outline: none; transition: border-color .15s ease; width: 100%; }
.field input:focus, .field select:focus { border-color: var(--border-strong); }

.btn-primary { width: 100%; padding: 15px; border-radius: var(--radius-sm); border: 1px solid var(--border-strong); background: linear-gradient(135deg, var(--purple-deep), var(--purple)); color: #fff; font-family: var(--font-display); font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; transition: transform .12s ease, box-shadow .15s ease; }
.btn-primary:active { transform: scale(0.98); }
.btn-primary[disabled] { opacity: 0.55; cursor: not-allowed; }
.btn-primary.danger { background: linear-gradient(135deg, #7f1d1d, var(--danger)); }

.btn-ghost { width: 100%; padding: 13px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 600; letter-spacing: 1px; }
.btn-ghost:active { background: var(--bg-elevated); }

.error-msg { font-size: 12.5px; color: var(--danger); text-align: center; min-height: 16px; }

.admin-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 30; background: rgba(6,3,9,0.9); backdrop-filter: blur(10px); }
.admin-header .title { font-family: var(--font-display); letter-spacing: 3px; font-size: 15px; color: var(--purple-bright); }
.logout-btn { font-size: 11.5px; color: var(--text-dim); letter-spacing: 1px; border: 1px solid var(--border); padding: 8px 14px; border-radius: 999px; background: transparent; }
.logout-btn:active { background: var(--bg-elevated); }

.tabs { display: flex; padding: 12px 18px 0; gap: 8px; }
.tab-btn { flex: 1; padding: 11px 0; text-align: center; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text-muted); font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
.tab-btn.active { color: #fff; border-color: var(--border-strong); background: linear-gradient(135deg, var(--purple-deep), var(--purple)); }

.admin-panel { padding: 18px; display: none; flex-direction: column; gap: 14px; }
.admin-panel.active { display: flex; }

.form-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.form-card h2 { font-family: var(--font-display); font-size: 14px; letter-spacing: 2px; color: var(--text); }

.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.image-drop { border: 1.5px dashed var(--border-strong); border-radius: var(--radius-sm); padding: 20px; text-align: center; color: var(--text-dim); font-size: 12.5px; position: relative; cursor: pointer; display: block; transition: border-color .15s ease, background .15s ease; }
.image-drop:active { background: var(--bg-elevated); }
.image-drop input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.image-drop img { max-height: 130px; margin: 0 auto 8px; border-radius: 8px; object-fit: cover; }
.image-drop svg { margin: 0 auto 6px; color: var(--purple-bright); display: block; }

.admin-product-list { display: flex; flex-direction: column; gap: 10px; }
.admin-product-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; display: flex; gap: 12px; align-items: center; }
.admin-product-item .thumb { width: 56px; height: 56px; border-radius: 8px; overflow: hidden; background: var(--bg-elevated); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--text-dim); }
.admin-product-item .thumb img { width: 100%; height: 100%; object-fit: cover; }
.admin-product-item .meta { flex: 1; min-width: 0; }
.admin-product-item .meta .n { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.admin-product-item .meta .p { font-size: 12px; color: var(--purple-bright); font-weight: 600; margin-top: 2px; }
.admin-product-item .meta .c { font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }

.stock-stepper { display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; padding: 3px; width: fit-content; }
.stock-stepper button { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--bg-elevated); color: var(--text); border: none; font-size: 14px; }
.stock-stepper button:active { background: var(--purple-deep); }
.stock-stepper .val { min-width: 20px; text-align: center; font-size: 12.5px; font-weight: 700; }

.item-actions { display: flex; flex-direction: column; gap: 6px; }
.icon-action { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text-muted); }
.icon-action.danger { color: var(--danger); border-color: rgba(239,68,68,0.3); }
.icon-action:active { transform: scale(0.9); }

.loader { width: 22px; height: 22px; border: 2.5px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: flex-end; justify-content: center; z-index: 200; backdrop-filter: blur(2px); }
.modal-overlay.open { display: flex; }
.modal-sheet { width: 100%; max-width: var(--max-width); background: var(--bg-elevated); border: 1px solid var(--border-strong); border-bottom: none; border-radius: 18px 18px 0 0; padding: 22px 20px 30px; animation: slide-up .2s ease; }
@keyframes slide-up { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-sheet h3 { font-family: var(--font-display); letter-spacing: 1.5px; margin-bottom: 6px; }
.modal-sheet p { font-size: 13px; color: var(--text-muted); margin-bottom: 18px; }
.modal-actions { display: flex; gap: 10px; }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--bg-elevated); border: 1px solid var(--border-strong); color: var(--text); padding: 12px 20px; border-radius: 999px; font-size: 13px; font-weight: 500; box-shadow: 0 8px 30px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 100; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

    <form id="loginForm" style="display:flex; flex-direction:column; gap:16px;">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required placeholder="admin@syxdra.com">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
      </div>
      <p class="error-msg" id="loginError"></p>
      <button type="submit" class="btn-primary" id="loginBtn">Ingresar</button>
    </form>
    <a href="index.html" style="text-align:center; font-size:12px; color:var(--text-dim); display:block;">← Volver a la tienda</a>
  </div>

  <!-- ===== PANEL ===== -->
  <div id="panelView" style="display:none;">
    <div class="admin-header">
      <span class="title">SYXDRA · ADMIN</span>
      <button class="logout-btn" id="logoutBtn">Cerrar sesión</button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="agregar">Agregar</button>
      <button class="tab-btn" data-tab="productos">Productos</button>
    </div>

    <div class="admin-panel active" id="tab-agregar">
      <div class="form-card">
        <h2>Nuevo producto</h2>
        <form id="productForm">
          <div class="field" style="margin-bottom:14px;">
            <label for="p-nombre">Nombre</label>
            <input type="text" id="p-nombre" required placeholder="Collar Chaos">
          </div>
          <div class="row-2" style="margin-bottom:14px;">
            <div class="field">
              <label for="p-precio">Precio ($)</label>
              <input type="number" id="p-precio" min="0" step="1" required placeholder="8500">
            </div>
            <div class="field">
              <label for="p-stock">Stock</label>
              <input type="number" id="p-stock" min="0" step="1" required placeholder="10">
            </div>
          </div>
          <div class="field" style="margin-bottom:14px;">
            <label for="p-categoria">Categoría</label>
            <select id="p-categoria" required>
              <option value="collares">Collares</option>
              <option value="anillos">Anillos</option>
              <option value="pulseras">Pulseras</option>
              <option value="aros">Aros</option>
              <option value="accesorios">Accesorios</option>
            </select>
          </div>
          <div class="field" style="margin-bottom:14px;">
        <label for="p-descripcion">Descripción</label>
          <textarea
          id="p-descripcion"
          rows="4"
          placeholder="Escribí una descripción del producto..."
          ></textarea>
        </div>
          <div class="field" style="margin-bottom:16px;">
            <label>Imagen del producto</label>
            <label class="image-drop" id="imageDrop">
              <div id="imageDropContent">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 16V4M12 4L7 9M12 4L17 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                Tocá para elegir una foto
              </div>
              <input type="file" id="p-imagen" accept="image/*">
            </label>
          </div>
          <p class="error-msg" id="formError"></p>
          <button type="submit" class="btn-primary" id="saveBtn">Guardar producto</button>
        </form>
      </div>
    </div>

    <div class="admin-panel" id="tab-productos">
      <div class="field">
        <input type="text" id="adminSearch" placeholder="Buscar producto...">
      </div>
      <div class="admin-product-list" id="adminProductList">
        <div class="loader" style="margin-top:30px;"></div>
      </div>
    </div>
  </div>

</div>

<!-- ===== MODAL: EDITAR ===== -->
<div class="modal-overlay" id="editModal">
  <div class="modal-sheet">
    <h3>Editar producto</h3>
    <p>Actualizá los datos y guardá los cambios.</p>
    <form id="editForm" style="display:flex; flex-direction:column; gap:14px;">
      <input type="hidden" id="e-id">
      <div class="field">
        <label for="e-nombre">Nombre</label>
        <input type="text" id="e-nombre" required>
      </div>
      <div class="row-2">
        <div class="field">
          <label for="e-precio">Precio ($)</label>
          <input type="number" id="e-precio" min="0" step="1" required>
        </div>
        <div class="field">
          <label for="e-stock">Stock</label>
          <input type="number" id="e-stock" min="0" step="1" required>
        </div>
      </div>
      <div class="field">
        <label for="e-categoria">Categoría</label>
        <select id="e-categoria" required>
          <option value="collares">Collares</option>
          <option value="anillos">Anillos</option>
          <option value="pulseras">Pulseras</option>
          <option value="aros">Aros</option>
          <option value="accesorios">Accesorios</option>
        </select>
      </div>
      <div class="field">
        <label>Cambiar imagen (opcional)</label>
        <label class="image-drop" id="editImageDrop">
          <div id="editImageDropContent">Tocá para reemplazar la foto</div>
          <input type="file" id="e-imagen" accept="image/*">
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="cancelEdit">Cancelar</button>
        <button type="submit" class="btn-primary" id="editSaveBtn">Guardar cambios</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== MODAL: ELIMINAR ===== -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal-sheet">
    <h3>¿Eliminar producto?</h3>
    <p>Esta acción no se puede deshacer. El producto se borrará de la tienda.</p>
    <div class="modal-actions">
      <button type="button" class="btn-ghost" id="cancelDelete">Cancelar</button>
      <button type="button" class="btn-primary danger" id="confirmDelete">Eliminar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   SYXDRA · CONFIGURACIÓN
   👇 EDITÁ ESTAS 3 LÍNEAS igual que en index.html
   ============================================================ */
const SUPABASE_URL = "https://elpxltbpmuwubhxwtanm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_RJDxbwGhRQeR6l_QMFSdIQ_5oq9m9Ri";
const STORAGE_BUCKET = "productos-imagenes";
const TABLE_NAME = "productos";
/* ============================================================ */

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let PRODUCTOS_ADMIN = [];
let archivoNuevo = null;
let archivoEdicion = null;
let idAEliminar = null;

const loginView = document.getElementById("loginView");
const panelView = document.getElementById("panelView");
const toastEl = document.getElementById("toast");

function mostrarToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 2200);
}

/* ---------- SESIÓN ---------- */
async function verificarSesion() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) mostrarPanel(); else mostrarLogin();
}
function mostrarLogin() { loginView.style.display = "flex"; panelView.style.display = "none"; }
function mostrarPanel() { loginView.style.display = "none"; panelView.style.display = "block"; cargarProductosAdmin(); }

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const errorEl = document.getElementById("loginError");
  const btn = document.getElementById("loginBtn");

  errorEl.textContent = "";
  btn.disabled = true;
  btn.innerHTML = `<div class="loader"></div>`;

  const { error } = await sb.auth.signInWithPassword({ email, password });

  btn.disabled = false;
  btn.textContent = "Ingresar";

  if (error) { errorEl.textContent = "Email o contraseña incorrectos."; return; }
  mostrarPanel();
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await sb.auth.signOut();
  mostrarLogin();
});

/* ---------- TABS ---------- */
document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
    document.querySelectorAll(".admin-panel").forEach((p) => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(`tab-${btn.dataset.tab}`).classList.add("active");
  });
});

/* ---------- AGREGAR PRODUCTO ---------- */
document.getElementById("p-imagen").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  archivoNuevo = file;
  const reader = new FileReader();
  reader.onload = (ev) => {
    document.getElementById("imageDropContent").innerHTML = `<img src="${ev.target.result}" alt="preview">`;
  };
  reader.readAsDataURL(file);
});

document.getElementById("productForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById("formError");
  const btn = document.getElementById("saveBtn");
  errorEl.textContent = "";

  const nombre = document.getElementById("p-nombre").value.trim();
  const precio = Number(document.getElementById("p-precio").value);
  const stock = Number(document.getElementById("p-stock").value);
  const categoria = document.getElementById("p-categoria").value;

  if (!nombre || precio < 0 || stock < 0) {
    errorEl.textContent = "Completá todos los campos correctamente.";
    return;
  }

  btn.disabled = true;
  btn.innerHTML = `<div class="loader"></div>`;

  try {
    let imagen_url = null;
    if (archivoNuevo) imagen_url = await subirImagen(archivoNuevo);

    const { error } = await sb.from(TABLE_NAME).insert([{ nombre, precio, categoria, stock, imagen_url }]);
    if (error) throw error;

    mostrarToast("Producto agregado ✦");
    document.getElementById("productForm").reset();
    document.getElementById("imageDropContent").innerHTML = `Tocá para elegir una foto`;
    archivoNuevo = null;
    cargarProductosAdmin();
  } catch (err) {
    console.error(err);
    errorEl.textContent = "No se pudo guardar. Revisá la conexión con Supabase.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Guardar producto";
  }
});

async function subirImagen(file) {
  const extension = file.name.split(".").pop();
  const nombreArchivo = `${crypto.randomUUID()}.${extension}`;
  const { error: errorSubida } = await sb.storage.from(STORAGE_BUCKET).upload(nombreArchivo, file, { cacheControl: "3600", upsert: false });
  if (errorSubida) throw errorSubida;
  const { data } = sb.storage.from(STORAGE_BUCKET).getPublicUrl(nombreArchivo);
  return data.publicUrl;
}

/* ---------- LISTAR / BUSCAR ---------- */
async function cargarProductosAdmin() {
  const lista = document.getElementById("adminProductList");
  const { data, error } = await sb.from(TABLE_NAME).select("*").order("creado_en", { ascending: false });

  if (error) {
    lista.innerHTML = `<p style="color:var(--danger); text-align:center; padding:20px;">Error al cargar productos.</p>`;
    return;
  }

  PRODUCTOS_ADMIN = data || [];
  renderizarListaAdmin();
}

function renderizarListaAdmin() {
  const lista = document.getElementById("adminProductList");
  const filtro = document.getElementById("adminSearch").value.trim().toLowerCase();
  const productos = PRODUCTOS_ADMIN.filter((p) => p.nombre.toLowerCase().includes(filtro));

  if (productos.length === 0) {
    lista.innerHTML = `<p style="color:var(--text-dim); text-align:center; padding:30px 0;">No hay productos todavía.</p>`;
    return;
  }

  lista.innerHTML = productos.map((p) => filaProductoAdmin(p)).join("");
  engancharEventosLista();
}

function filaProductoAdmin(p) {
  const precioFormateado = Number(p.precio).toLocaleString("es-AR");
  return `
    <div class="admin-product-item" data-id="${p.id}">
      <div class="thumb">
        ${p.imagen_url ? `<img src="${p.imagen_url}" alt="">` : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 3L21 21M21 3L3 21" stroke="currentColor" stroke-width="1.2"/></svg>`}
      </div>
      <div class="meta">
        <div class="n">${escaparHtml(p.nombre)}</div>
        <div class="p">$${precioFormateado}</div>
        <div class="c">${p.categoria}</div>
        <div class="stock-stepper" style="margin-top:6px;">
          <button type="button" data-stock-down="${p.id}">−</button>
          <span class="val" id="stock-${p.id}">${p.stock}</span>
          <button type="button" data-stock-up="${p.id}">+</button>
        </div>
      </div>
      <div class="item-actions">
        <button class="icon-action" data-edit="${p.id}" aria-label="Editar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-action danger" data-delete="${p.id}" aria-label="Eliminar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0v14a1 1 0 01-1 1H7a1 1 0 01-1-1V6h12z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>`;
}

function escaparHtml(texto) {
  const div = document.createElement("div");
  div.textContent = texto;
  return div.innerHTML;
}

document.getElementById("adminSearch").addEventListener("input", renderizarListaAdmin);

/* ---------- STOCK RÁPIDO ---------- */
function engancharEventosLista() {
  document.querySelectorAll("[data-stock-up]").forEach((btn) => btn.addEventListener("click", () => cambiarStock(btn.dataset.stockUp, 1)));
  document.querySelectorAll("[data-stock-down]").forEach((btn) => btn.addEventListener("click", () => cambiarStock(btn.dataset.stockDown, -1)));
  document.querySelectorAll("[data-edit]").forEach((btn) => btn.addEventListener("click", () => abrirModalEdicion(btn.dataset.edit)));
  document.querySelectorAll("[data-delete]").forEach((btn) => btn.addEventListener("click", () => abrirModalEliminar(btn.dataset.delete)));
}

async function cambiarStock(id, delta) {
  const producto = PRODUCTOS_ADMIN.find((p) => p.id === id);
  if (!producto) return;
  const nuevoStock = Math.max(0, producto.stock + delta);

  document.getElementById(`stock-${id}`).textContent = nuevoStock;
  producto.stock = nuevoStock;

  const { error } = await sb.from(TABLE_NAME).update({ stock: nuevoStock }).eq("id", id);
  if (error) { mostrarToast("No se pudo actualizar el stock"); console.error(error); }
}

/* ---------- EDITAR ---------- */
const editModal = document.getElementById("editModal");

function abrirModalEdicion(id) {
  const p = PRODUCTOS_ADMIN.find((prod) => prod.id === id);
  if (!p) return;

  archivoEdicion = null;
  document.getElementById("e-id").value = p.id;
  document.getElementById("e-nombre").value = p.nombre;
  document.getElementById("e-precio").value = p.precio;
  document.getElementById("e-stock").value = p.stock;
  document.getElementById("e-categoria").value = p.categoria;
  document.getElementById("editImageDropContent").innerHTML = p.imagen_url ? `<img src="${p.imagen_url}" alt="">` : `Tocá para reemplazar la foto`;

  editModal.classList.add("open");
}

document.getElementById("cancelEdit").addEventListener("click", () => editModal.classList.remove("open"));

document.getElementById("e-imagen").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  archivoEdicion = file;
  const reader = new FileReader();
  reader.onload = (ev) => { document.getElementById("editImageDropContent").innerHTML = `<img src="${ev.target.result}" alt="preview">`; };
  reader.readAsDataURL(file);
});

document.getElementById("editForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("editSaveBtn");
  btn.disabled = true;
  btn.innerHTML = `<div class="loader"></div>`;

  const id = document.getElementById("e-id").value;
  const cambios = {
    nombre: document.getElementById("e-nombre").value.trim(),
    precio: Number(document.getElementById("e-precio").value),
    stock: Number(document.getElementById("e-stock").value),
    categoria: document.getElementById("e-categoria").value,
  };

  try {
    if (archivoEdicion) cambios.imagen_url = await subirImagen(archivoEdicion);

    const { error } = await sb.from(TABLE_NAME).update(cambios).eq("id", id);
    if (error) throw error;

    mostrarToast("Cambios guardados ✦");
    editModal.classList.remove("open");
    cargarProductosAdmin();
  } catch (err) {
    console.error(err);
    mostrarToast("No se pudieron guardar los cambios");
  } finally {
    btn.disabled = false;
    btn.textContent = "Guardar cambios";
  }
});

/* ---------- ELIMINAR ---------- */
const deleteModal = document.getElementById("deleteModal");

function abrirModalEliminar(id) { idAEliminar = id; deleteModal.classList.add("open"); }

document.getElementById("cancelDelete").addEventListener("click", () => {
  deleteModal.classList.remove("open");
  idAEliminar = null;
});

document.getElementById("confirmDelete").addEventListener("click", async () => {
  if (!idAEliminar) return;
  const btn = document.getElementById("confirmDelete");
  btn.disabled = true;
  btn.innerHTML = `<div class="loader"></div>`;

  const { error } = await sb.from(TABLE_NAME).delete().eq("id", idAEliminar);

  btn.disabled = false;
  btn.textContent = "Eliminar";
  deleteModal.classList.remove("open");

  if (error) { mostrarToast("No se pudo eliminar el producto"); console.error(error); }
  else { mostrarToast("Producto eliminado"); cargarProductosAdmin(); }
  idAEliminar = null;
});

/* ---------- INICIO ---------- */
verificarSesion();
</script>
</body>
</html>
